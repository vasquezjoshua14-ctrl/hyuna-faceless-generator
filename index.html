<!DOCTYPE html>
<html>
<head>
  <title>Hyuna Faceless Generator Prompt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎀 Hyuna Faceless Generator Prompt</h1>

<p>Create professional faceless product photography prompts with AI</p>


<div class="box">
<h2>📷 Upload Product Image</h2>
<input type="file">
</div>


<div class="box">
<h2>🌸 Background Style</h2>

<button>✨ Auto Match</button>
<button>🎀 Cute Pinterest Room</button>
<button>🛏 Master Bedroom</button>
<button>🪞 Vanity Table</button>
<button>🖤 Luxury Studio</button>
<button>🪟 Window Light</button>
<button>🚗 Car Interior</button>

</div>


<div class="box">
<h2>📸 Camera Angle</h2>

<button>✨ Auto Match</button>
<button>⬇️ Top Down</button>
<button>📷 Low Angle</button>
<button>🎯 Extreme Focus</button>
<button>🖼 Middle Shot</button>
<button>🌎 Wide Lifestyle</button>

</div>


<div class="box">
<h2>🤍 Hand Hold Style</h2>

<button>✨ Auto Match</button>
<button>🤏 One Hand Hold</button>
<button>👐 Two Hands Presentation</button>
<button>📦 Product On Surface</button>

</div>


<div class="box">
<h2>💅 Nail Style</h2>

<button>✨ Auto Match</button>
<button>Nude Glossy</button>
<button>French Tips</button>
<button>Korean Jelly</button>
<button>Pearl Luxury</button>
<button>Chrome</button>

</div>


<div class="box">
<h2>💍 Accessories</h2>

<button>✨ Auto Match</button>
<button>Gold Ring</button>
<button>Pearl Bracelet</button>
<button>Luxury Watch</button>
<button>No Accessories</button>

</div>


<button class="generate">
✨ Generate Prompt
</button>
<div class="box">
<h2>✨ Generated Prompt</h2>

<textarea id="result" rows="10" placeholder="Your AI prompt will appear here..."></textarea>

<button onclick="copyPrompt()">📋 Copy Prompt</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
